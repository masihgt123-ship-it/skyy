name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: SkyRescue-New
    env:
      GODOT_VERSION: 4.4.1
      GODOT_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
      GODOT_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
      GODOT_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure editor paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Restore missing Persian font
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf fonts/DejaVuSans.ttf
          mkdir -p licenses
          cp /usr/share/doc/fonts-dejavu-core/copyright licenses/DejaVu-copyright.txt

      - name: Import project
        run: |
          set -eo pipefail
          godot --headless --editor --path . --import 2>&1 | tee import.log

      - name: Reject script errors
        run: |
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then exit 1; fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$GODOT_KEYSTORE_RELEASE_USER" ] || [ -z "$GODOT_KEYSTORE_RELEASE_PASSWORD" ]; then
            echo 'Add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GODOT_KEYSTORE_RELEASE_PATH"

      - name: Build release APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release Android build/SkyRescue.apk
          test -s build/SkyRescue.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/SkyRescue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkyRescue-APK
          path: SkyRescue-New/build/SkyRescue.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SkyRescue-New/build/SkyRescue.apk
          generate_release_notes: true
          prerelease: true

      - name: Remove signing key
        if: always()
        run: rm -f "$GODOT_KEYSTORE_RELEASE_PATH"

          EOF

      - name: Set app icon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          icon = "res://SkyRescue-App-Icon.png"
          if not Path("SkyRescue-App-Icon.png").is_file():
              raise SystemExit("Missing SkyRescue-New/SkyRescue-App-Icon.png")

          def update(text, section, key, value):
              pattern = r"^\[" + re.escape(section) + r"\][ \t]*\r?$"
              header = re.search(pattern, text, re.M)
              line = f'{key}="{value}"'
              if not header:
                  return text + f"\n[{section}]\n{line}\n"
              start = header.end()
              following = re.search(r"^\[", text[start:], re.M)
              end = start + following.start() if following else len(text)
              body = text[start:end]
              setting = r"^" + re.escape(key) + r"[ \t]*=.*$"
              if re.search(setting, body, re.M):
                  body = re.sub(setting, lambda _: line, body, flags=re.M)
              else:
                  body = "\n" + line + "\n" + body
              return text[:start] + body + text[end:]

          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")
          text = update(text, "application", "config/icon", icon)
          p.write_text(text, encoding="utf-8")

          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")
          for key in (
              "launcher_icons/main_192x192",
              "launcher_icons/adaptive_foreground_432x432",
          ):
              text = update(text, "preset.0.options", key, icon)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Import project
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee first-import.log
          godot --headless --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error loading custom project theme' import.log; then
            echo "::error::Project import failed"
            exit 1
          fi

      - name: Build test APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/SkyRescue-test.apk 2>&1 | tee build.log
          test -s build/SkyRescue-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/SkyRescue-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyRescue-test-APK
          path: SkyRescue-New/build/SkyRescue-test.apk
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyRescue-build-logs
          path: |
            SkyRescue-New/first-import.log
            SkyRescue-New/import.log
            SkyRescue-New/build.log
          if-no-files-found: ignore

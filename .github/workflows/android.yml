name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: SkyRescue-New

    env:
      GODOT_VERSION: "4.4.1"

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android tools
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl -fL --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo install \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          curl -fL --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.zip

          unzip -q /tmp/templates.zip -d /tmp/godot-templates

          DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DIR"
          cp -a /tmp/godot-templates/templates/. "$DIR/"

          test -s "$DIR/android_release.apk"

      - name: Prepare font and icon
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

          mkdir -p fonts licenses

          if [ ! -s fonts/DejaVuSans.ttf ]; then
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
              fonts/DejaVuSans.ttf
          fi

          cp /usr/share/doc/fonts-dejavu-core/copyright \
            licenses/DejaVu-copyright.txt

          cp ../SkyRescue-App-Icon.png ./SkyRescue-App-Icon.png

      - name: Decrypt release key
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing RELEASE_KEY_PASSWORD secret"
            exit 1
          fi

          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 600000 \
            -in ../skyrescue-release.jks.enc \
            -out "$RUNNER_TEMP/skyrescue-release.jks" \
            -pass env:RELEASE_KEY_PASSWORD

          keytool -list \
            -keystore "$RUNNER_TEMP/skyrescue-release.jks" \
            -storepass:env RELEASE_KEY_PASSWORD \
            -alias skyrescue > /dev/null

          echo "GODOT_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/skyrescue-release.jks" >> "$GITHUB_ENV"

      - name: Configure project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def setting(text, section, key, value):
              header = re.search(
                  r"^\[" + re.escape(section) + r"\][ \t]*\r?$",
                  text,
                  re.M
              )
              line = key + "=" + value
              if not header:
                  return text + "\n[" + section + "]\n" + line + "\n"

              start = header.end()
              next_section = re.search(r"^\[", text[start:], re.M)
              end = start + next_section.start() if next_section else len(text)
              body = text[start:end]
              pattern = r"^" + re.escape(key) + r"[ \t]*=.*$"

              if re.search(pattern, body, re.M):
                  body = re.sub(
                      pattern, lambda _: line, body, flags=re.M
                  )
              else:
                  body = "\n" + line + "\n" + body

              return text[:start] + body + text[end:]

          icon = json.dumps("res://SkyRescue-App-Icon.png")

          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")
          text = setting(text, "application", "config/icon", icon)
          text = setting(
              text,
              "rendering",
              "textures/vram_compression/import_etc2_astc",
              "true"
          )
          p.write_text(text, encoding="utf-8")

          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")

          for key, value in {
              "launcher_icons/main_192x192": icon,
              "launcher_icons/adaptive_foreground_432x432": icon,
              "package/signed": "true",
          }.items():
              text = setting(text, "preset.0.options", key, value)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Configure Godot
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"

          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project
        run: |
          set -euo pipefail

          godot --headless --editor --path . --import \
            2>&1 | tee first-import.log

          godot --headless --editor --path . --import \
            2>&1 | tee import.log

          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Error loading custom project theme' import.log; then
            echo "::error::Project import failed"
            exit 1
          fi

      - name: Build release APK
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f export_presets.cfg' EXIT

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          password = os.environ["RELEASE_KEY_PASSWORD"]
          if not password:
              raise SystemExit("Missing RELEASE_KEY_PASSWORD secret")

          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")

          values = {
              "keystore/release": os.environ["GODOT_KEYSTORE_RELEASE_PATH"],
              "keystore/release_user": "skyrescue",
              "keystore/release_password": password,
          }

          header = "[preset.0.options]"
          if header not in text:
              raise SystemExit("Missing preset.0.options")

          for key in values:
              text = re.sub(
                  r"^" + re.escape(key) + r"[ \t]*=.*\n?",
                  "",
                  text,
                  flags=re.M
              )

          lines = "\n".join(
              key + "=" + json.dumps(value)
              for key, value in values.items()
          )

          text = text.replace(header, header + "\n" + lines, 1)
          p.write_text(text, encoding="utf-8")
          PY

          mkdir -p build

          godot --headless --path . \
            --export-release "Android" \
            build/SkyRescue-release.apk \
            2>&1 | tee build.log

          test -s build/SkyRescue-release.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose build/SkyRescue-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyRescue-RELEASE-APK
          path: SkyRescue-New/build/SkyRescue-release.apk
          if-no-files-found: error

      - name: Delete decrypted key and signing settings
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/skyrescue-release.jks"
          rm -f export_presets.cfg

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkyRescue-release-logs
          path: |
            SkyRescue-New/first-import.log
            SkyRescue-New/import.log
            SkyRescue-New/build.log
          if-no-files-found: ignore
